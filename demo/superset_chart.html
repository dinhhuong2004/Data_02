<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Events — Superset Embed</title>
  <script src="https://unpkg.com/@superset-ui/embedded-sdk"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #15181d;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #d9dee7;
    }

    header h1 { margin: 0; font-size: 18px; font-weight: 700; }

    .badge {
      font-size: 12px;
      color: #0f9f6e;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 999px;
      padding: 3px 10px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #d9dee7;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #f0f2f5;
      font-size: 14px;
      font-weight: 600;
    }

    #superset-container {
      width: 100%;
      height: 600px;
    }

    #superset-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .error {
      padding: 24px;
      color: #dc2626;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Login Events Dashboard</h1>
    <span class="badge" id="status">Loading...</span>
  </header>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span>Superset Dashboard</span>
      </div>
      <div id="superset-container"></div>
    </div>
  </main>

  <script>
    // ── CONFIG ─────────────────────────────────────────────────────────────
    const SUPERSET_DOMAIN = "http://172.17.93.240:8089";
    const API_BASE        = "http://172.17.93.240:8000";

    // Paste the embedded UUID from Superset UI here
    // Dashboard → "..." menu → Embed dashboard → copy UUID
    const DASHBOARD_EMBEDDED_ID = "597eb34f-a966-4cbc-a0a5-bb0d4c915910";
    // ───────────────────────────────────────────────────────────────────────

    async function fetchGuestToken() {
      const res = await fetch(
        `${API_BASE}/superset/guest-token?embedded_id=${DASHBOARD_EMBEDDED_ID}`
      );
      if (!res.ok) throw new Error(`Guest token error: ${res.status}`);
      const data = await res.json();
      return data.token;
    }

    supersetEmbeddedSdk.embedDashboard({
      id: DASHBOARD_EMBEDDED_ID,
      supersetDomain: SUPERSET_DOMAIN,
      mountPoint: document.getElementById("superset-container"),
      fetchGuestToken,
      dashboardUiConfig: {
        hideTitle: true,
        hideTab: true,
        hideChartControls: false,
      },
    }).then(() => {
      document.getElementById("status").textContent = "Live";
    }).catch(err => {
      document.getElementById("status").textContent = "Error";
      document.getElementById("superset-container").innerHTML =
        `<div class="error">Failed to load dashboard: ${err.message}</div>`;
      console.error(err);
    });
  </script>
</body>
</html>
